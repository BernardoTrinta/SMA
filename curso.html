<style>
    /* ============================
   HEADER
============================ */
header {
  padding: 20px;
  box-shadow: 10px 10px 10px 10px black;
}

/* ============================
   SECTION E CARDS
============================ */
section {
  width: 90%;
  height: 600px;
  display: flex;
  overflow: hidden;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
}

section > div {
  margin: 40px;
  max-width: 400px;
  min-width: 200px;
  text-align: center;
  border-radius: 20px;
  transition: all 0.3s ease;
}

section > div:hover {
  transform: translateY(-5px);
  box-shadow: 10px 6px 16px rgba(0, 0, 0, 0.15);
}

/* ============================
   BOTÕES
============================ */
button {
  background-color: rgb(255, 238, 0);
  border-radius: 10px;
  min-height: 40px;
  width: 90%;
  font-size: 1.5em;
  margin: 10px auto;
  text-align: center;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

button > a {
  padding: 0;
  color: black;
  text-decoration: none;
  display: block;
  width: 100%;
  height: 100%;
}

/* ============================
   IMAGENS
============================ */
img {
  height: 90%;
  width: auto;
  max-width: 100%;
  border-radius: 10px;
}

/* ============================
   RESPONSIVIDADE
============================ */
@media (max-width: 768px) {
  section {
    flex-direction: column;
    align-items: center;
    padding: 10px;
    height: auto;
  }

  section > div {
    width: 95%;
  }

  button {
    font-size: 1.2em;
  }
}

@media (max-width: 480px) {
  button {
    font-size: 1em;
    padding: 8px;
  }
}




</style>
