 <style>
  /* ============================
   IFRAME
============================ */
iframe {
  margin: 40px auto;
  width: 700px;
  height: 400px;
  border-radius: 10px;
  display: block;
}

/* ============================
   CONTAINER DE VÍDEOS
============================ */
section {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  width: 100%;
  padding: 20px;
}

/* ============================
   VÍDEO INDIVIDUAL
============================ */
video {
  max-width: 400px;
  max-height: 500px;
  min-width: 200px;
  min-height: 30px;
  padding: 20px;
  border-radius: 10px;
  display: block;
  margin: auto;
  background-color: #111; /* opcional: contraste com fundo preto */
}

/* ============================
   TÍTULO OU TEXTO EM DESTAQUE
============================ */
.HD {
  color: yellow;
  text-align: center;
  margin: 20px auto;
  font-weight: bold;
  font-size: 1.5em;
}

/* ============================
   HEADER
============================ */
header {
  padding: 20px;
  text-align: center;
}

/* ============================
   RESPONSIVO - TABLET
============================ */
@media (max-width: 768px) {
  iframe {
    width: 90%;
    height: 300px;
    margin: 30px auto;
  }

  video {
    width: 100%;
    padding: 10px;
  }

  .HD {
    font-size: 1.2em;
  }
}

/* ============================
   RESPONSIVO - CELULAR
============================ */
@media (max-width: 480px) {
  iframe {
    width: 90%;
    height: 250px;
    margin: 20px auto;
  }

  video {
    width: 90%;
    padding: 8px;
  }

  header {
    max-width: 100%;
  }

  body {
    max-height: 100vh;
  }

  .HD {
    font-size: 1em;
  }
}

 </style>
</head>
